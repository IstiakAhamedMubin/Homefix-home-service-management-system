<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - HomeFix</title>

  <!-- Google Fonts: Manrope for headings, Inter for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Link to our main stylesheet (shared across every page) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Standalone gate: no public navbar/footer here on purpose, so it's
       visually distinct from the customer-facing login (matches the
       original design spec: dark full-page background, centered card). -->
  <section class="admin-auth-page">
    <div class="auth-card">

      <div class="auth-card-header">
        <div class="auth-card-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
        <h1>Admin Sign In</h1>
        <p>Sign in to manage HomeFix bookings, providers, and payments.</p>
      </div>

      <!-- Frontend-only form: no backend, so we prevent the real
           submit and just run basic validation with JavaScript -->
      <form id="adminLoginForm" class="auth-form" novalidate>

        <div class="form-field">
          <label for="adminEmail">Admin Email</label>
          <input
            type="text"
            id="adminEmail"
            name="adminEmail"
            placeholder="admin@homefix.example"
            autocomplete="username"
            required
          >
          <span class="field-error" id="adminEmailError"></span>
        </div>

        <div class="form-field">
          <label for="adminPassword">Password</label>
          <input
            type="password"
            id="adminPassword"
            name="adminPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <span class="field-error" id="adminPasswordError"></span>
        </div>

        <!-- Shown only if login is "successful" (demo purposes only) -->
        <p class="form-success" id="adminLoginSuccess"></p>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>

      </form>

      <p class="auth-switch">
        <a href="index.html">&larr; Back to HomeFix</a>
      </p>

    </div>
  </section>

  <!-- Shared JavaScript file (nav toggle, footer year, form validation,
       and now admin login validation) -->
  <script src="js/store.js"></script>
<script src="js/script.js"></script>
<script>
(function () {
  "use strict";
  if (localStorage.getItem("homefixAdminLoggedIn") === "true") { location.replace("admin.html"); return; }
  var form = document.getElementById("adminLoginForm");
  var email = document.getElementById("adminEmail"), pass = document.getElementById("adminPassword");
  var eErr = document.getElementById("adminEmailError"), pErr = document.getElementById("adminPasswordError");
  var ok = document.getElementById("adminLoginSuccess");
  var pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function flag(input, el, msg) { el.textContent = msg; input.classList.toggle("invalid", !!msg); return !msg; }
  [email, pass].forEach(function (i) { i.addEventListener("input", function () { flag(i, i === email ? eErr : pErr, ""); }); });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var a = flag(email, eErr, !email.value.trim() ? "Email is required." : !pattern.test(email.value.trim()) ? "Enter a valid email address." : "");
    var b = flag(pass, pErr, !pass.value ? "Password is required." : pass.value.length < 6 ? "Password must be at least 6 characters." : "");
    if (!a || !b) return;
    localStorage.setItem("homefixAdminLoggedIn", "true");
    ok.textContent = "Signed in. Redirecting…";
    setTimeout(function () { location.href = "admin.html"; }, 400);
  });
})();
</script>
</body>
</html>
